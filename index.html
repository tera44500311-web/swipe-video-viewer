<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14161B">
<title>Tilt Swipe Viewer</title>
<style>
  :root{
    --bg:#14161B;
    --panel:#1B1F27;
    --line:#2B313D;
    --text:#E6E9F0;
    --dim:#858FA3;
    --accent:#9BA8FF;
    --sans: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}

  #stage{
    position:relative;flex:1;min-height:0;overflow:hidden;background:#000;
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;
  }
  #stage.dragging{cursor:grabbing}
  video{position:absolute;display:block;background:#000}

  #empty{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
  }
  #empty p{color:var(--dim);font-size:13px;line-height:1.7;max-width:32ch}
  #empty.hide{display:none}
  #shuffleWrap{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--dim);user-select:none;cursor:pointer;
  }
  #shuffleWrap input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}

  /* elevation gauge: where you are looking inside the frame */
  #gauge{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:2px;height:42%;background:var(--line);border-radius:2px;opacity:0;
    transition:opacity .3s;pointer-events:none;
  }
  #gauge.on{opacity:1}
  #gauge::before,#gauge::after{content:"";position:absolute;left:-4px;width:10px;height:1px;background:var(--line)}
  #gauge::before{top:0}#gauge::after{bottom:0}
  #thumb{
    position:absolute;left:50%;width:11px;height:11px;margin-left:-5.5px;margin-top:-5.5px;
    border:1.5px solid var(--accent);border-radius:50%;background:rgba(155,168,255,.15);
  }
  #hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:11px;color:var(--dim);background:rgba(20,22,27,.85);
    padding:5px 11px;border-radius:999px;border:1px solid var(--line);
    opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;
    max-width:86%;overflow:hidden;text-overflow:ellipsis;
  }
  #hint.on{opacity:1}

  /* playlist counter (top-left of stage) */
  #vcount{
    position:absolute;left:12px;top:12px;
    font-family:var(--mono);font-size:11px;color:var(--text);
    background:rgba(20,22,27,.7);border:1px solid var(--line);
    padding:4px 10px;border-radius:999px;pointer-events:none;
    opacity:0;transition:opacity .3s;
  }
  #vcount.on{opacity:1}

  /* ---- compact control bar ---- */
  #bar{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 10px 8px}

  #seekRow{display:flex;align-items:center;gap:8px}
  .time{font-family:var(--mono);font-size:10px;color:var(--dim);flex:0 0 auto;min-width:34px}
  .time.r{text-align:right}
  #seek{flex:1;min-width:0}

  #ctl{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
  #ctl.hide{display:none}

  button,.btn{
    font-family:var(--sans);font-size:12px;color:var(--text);
    background:transparent;border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;cursor:pointer;line-height:1;white-space:nowrap;
  }
  button:hover,.btn:hover{border-color:var(--accent)}
  button:active,.btn:active{background:rgba(155,168,255,.1)}
  button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}
  .btn.primary,button.primary{border-color:var(--accent);color:var(--accent)}
  input[type=file]{position:absolute;width:1px;height:1px;opacity:0}

  #zoomWrap{display:flex;align-items:center;gap:7px;flex:1;min-width:110px}
  #zoomWrap label{font-size:10px;color:var(--dim);flex:0 0 auto}
  #zoomV{font-family:var(--mono);font-size:10px;color:var(--accent);flex:0 0 auto;min-width:32px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent)}
  input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  input[type=range]:disabled{opacity:.4}

  #fold{padding:6px 9px;font-size:11px;color:var(--dim);flex:0 0 auto}

  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="stage">
  <video id="v" playsinline webkit-playsinline loop preload="auto"></video>

  <div id="empty">
    <label class="btn primary" for="file">動画を選ぶ（複数可）</label>
    <label id="shuffleWrap">
      <input type="checkbox" id="shuffle"> シャッフル再生
    </label>
    <p>端末を傾けると、映像の見えている範囲が動きます。<br>複数の動画を選ぶと、素早い縦スワイプで<br>次の動画・前の動画に切り替えられます。</p>
  </div>

  <div id="gauge"><div id="thumb"></div></div>
  <div id="hint"></div>
  <div id="vcount"></div>
</div>

<div id="bar">
  <div id="seekRow">
    <span class="time" id="tCur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled aria-label="再生位置">
    <span class="time r" id="tDur">0:00</span>
    <button id="fold" aria-expanded="true" title="操作パネルの表示切替">▾</button>
  </div>

  <div id="ctl">
    <input type="file" id="file" accept="video/*" multiple>
    <label class="btn" for="file">動画</label>
    <button id="prevBtn" disabled aria-label="前の動画">◀</button>
    <button id="nextBtn" disabled aria-label="次の動画">▶</button>
    <button id="motion" hidden>傾きON</button>
    <button id="center" disabled>中央</button>
    <button id="normal">通常再生</button>
    <button id="full">全画面</button>
    <span id="zoomWrap">
      <label for="zoom">ズーム</label>
      <input type="range" id="zoom" min="1" max="3" step="0.05" value="1.5">
      <span id="zoomV">1.50×</span>
    </span>
  </div>
</div>

<script>
(function(){
  /* fixed tuning — previously exposed as sliders */
  const RANGE_DEG = 25;    // tilt needed to reach the edge
  const SMOOTH    = 0.2;   // follow easing
  const USE_X     = true;  // left/right tilt always active

  /* swipe-to-switch tuning */
  const SWIPE_DIST = 70;   // px of vertical travel to count as a swipe
  const SWIPE_TIME = 500;  // ms — must be a quick flick, not a slow pan

  const stage=document.getElementById('stage');
  const v=document.getElementById('v');
  const empty=document.getElementById('empty');
  const gauge=document.getElementById('gauge');
  const thumb=document.getElementById('thumb');
  const hint=document.getElementById('hint');
  const vcount=document.getElementById('vcount');

  const fileEl=document.getElementById('file');
  const prevBtn=document.getElementById('prevBtn');
  const nextBtn=document.getElementById('nextBtn');
  const motionBtn=document.getElementById('motion');
  const centerBtn=document.getElementById('center');
  const normalBtn=document.getElementById('normal');
  const fullBtn=document.getElementById('full');
  const zoomEl=document.getElementById('zoom'), zoomV=document.getElementById('zoomV');
  const seek=document.getElementById('seek'), tCur=document.getElementById('tCur'), tDur=document.getElementById('tDur');
  const foldBtn=document.getElementById('fold'), ctl=document.getElementById('ctl');

  let vw=0, vh=0, maxX=0, maxY=0;
  let zoom=1.5, normalMode=false;
  let pitch=0, roll=0, originP=null, originR=0, gyroSeen=false;
  let curX=0, curY=0, dragOffX=0, dragOffY=0;

  const effZoom = ()=> normalMode ? 1 : zoom;

  /* ---------- playlist ---------- */
  let playlist=[], urls=[], idx=0;

  function updateCounter(){
    if(playlist.length>1){
      vcount.textContent=(idx+1)+' / '+playlist.length;
      vcount.classList.add('on');
    }else{
      vcount.classList.remove('on');
    }
    prevBtn.disabled = nextBtn.disabled = playlist.length<2;
  }

  function loadVideo(i, first){
    if(!playlist.length) return;
    idx=((i % playlist.length) + playlist.length) % playlist.length; // ループ(末尾→先頭)
    if(!urls[idx]) urls[idx]=URL.createObjectURL(playlist[idx]);

    vw=vh=0; maxX=maxY=0;
    seek.disabled=true; seek.value=0;
    tCur.textContent='0:00'; tDur.textContent='0:00';
    dragOffX=dragOffY=0;

    v.src=urls[idx]; v.load();
    v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); if(first) showHint('タップで再生',2500); });

    updateCounter();
    if(!first) showHint((idx+1)+'/'+playlist.length+'　'+playlist[idx].name,1800);
  }

  const shuffleCk=document.getElementById('shuffle');

  fileEl.addEventListener('change',()=>{
    const fs=Array.from(fileEl.files||[]).filter(f=>f.type.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/i.test(f.name));
    if(!fs.length) return;
    if(shuffleCk.checked){
      for(let i=fs.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [fs[i],fs[j]]=[fs[j],fs[i]];
      }
    }
    urls.forEach(u=>{ if(u) URL.revokeObjectURL(u); });
    urls=[]; playlist=fs;
    loadVideo(0, true);
    empty.classList.add('hide');
    if(playlist.length>1) showHint('縦に素早くスワイプで動画を切り替え',2600);
    else if(!gyroSeen && !motionBtn.hidden) showHint('「傾きON」を押してください',3000);
  });

  prevBtn.addEventListener('click',()=>loadVideo(idx-1));
  nextBtn.addEventListener('click',()=>loadVideo(idx+1));

  /* PCホイールでも切り替え(デバウンス付き) */
  let wheelLock=0;
  stage.addEventListener('wheel',e=>{
    if(playlist.length<2) return;
    const now=Date.now();
    if(now-wheelLock<400) return;
    wheelLock=now;
    loadVideo(idx + (e.deltaY>0 ? 1 : -1));
  },{passive:true});

  /* ---------- layout ---------- */
  function layout(){
    if(!vw) return;
    const sw=stage.clientWidth, sh=stage.clientHeight;
    const s=Math.min(sw/vw, sh/vh)*effZoom();
    const w=vw*s, h=vh*s;
    v.style.width=w+'px'; v.style.height=h+'px';
    v.style.left=((sw-w)/2)+'px'; v.style.top=((sh-h)/2)+'px';
    maxX=Math.max(0,(w-sw)/2);
    maxY=Math.max(0,(h-sh)/2);
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', ()=>setTimeout(layout,300));

  /* ---------- tilt ---------- */
  function screenAngle(){
    if(screen.orientation && typeof screen.orientation.angle==='number') return screen.orientation.angle;
    if(typeof window.orientation==='number') return (window.orientation+360)%360;
    return 0;
  }
  function onOrient(e){
    if(e.beta===null && e.gamma===null) return;
    const b=e.beta||0, g=e.gamma||0, a=screenAngle();
    if(a===90){ pitch=-g; roll=b; }
    else if(a===270||a===-90){ pitch=g; roll=-b; }
    else if(a===180){ pitch=-b; roll=-g; }
    else{ pitch=b; roll=g; }

    if(!gyroSeen){
      gyroSeen=true; originP=pitch; originR=roll;
      centerBtn.disabled=false;
      if(!normalMode) gauge.classList.add('on');
      showHint('傾きを検出しました',1600);
    }
  }
  function startMotion(){
    const D=window.DeviceOrientationEvent;
    if(!D){ showHint('この端末では傾きセンサーが使えません',3000); return; }
    if(typeof D.requestPermission==='function'){
      D.requestPermission().then(r=>{
        if(r==='granted'){ window.addEventListener('deviceorientation',onOrient); motionBtn.hidden=true; }
        else showHint('傾きの利用が許可されませんでした',3000);
      }).catch(()=>showHint('傾きの利用を開始できませんでした',3000));
    }else{
      window.addEventListener('deviceorientation',onOrient); motionBtn.hidden=true;
    }
  }
  if(window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission==='function'){
    motionBtn.hidden=false;                       // iOS needs an explicit tap
  }else{
    window.addEventListener('deviceorientation', onOrient);
  }
  motionBtn.addEventListener('click', startMotion);
  centerBtn.addEventListener('click', ()=>{ originP=pitch; originR=roll; showHint('中央をリセットしました',1400); });

  /* ---------- render loop ---------- */
  const clamp=(x,a,b)=> x<a?a:(x>b?b:x);
  function frame(){
    let tX=0,tY=0;
    if(!normalMode){
      if(gyroSeen && originP!==null){
        tY=clamp((pitch-originP)/RANGE_DEG,-1,1)*maxY;
        if(USE_X) tX=clamp((roll-originR)/RANGE_DEG,-1,1)*maxX;
      }else{
        tX=clamp(dragOffX,-maxX,maxX);
        tY=clamp(dragOffY,-maxY,maxY);
      }
    }
    curX+=(tX-curX)*SMOOTH;
    curY+=(tY-curY)*SMOOTH;
    v.style.transform='translate3d('+curX.toFixed(2)+'px,'+curY.toFixed(2)+'px,0)';
    if(maxY>0 && !normalMode) thumb.style.top=((0.5-clamp(-curY/maxY,-1,1)*0.5)*100)+'%';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- drag / tap / swipe ---------- */
  let dragging=false,lastPX=0,lastPY=0,moved=0;
  let startPX=0,startPY=0,startT=0;

  stage.addEventListener('pointerdown',e=>{
    dragging=true;moved=0;
    lastPX=startPX=e.clientX; lastPY=startPY=e.clientY; startT=Date.now();
    stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dx=e.clientX-lastPX,dy=e.clientY-lastPY;
    lastPX=e.clientX;lastPY=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    if(!gyroSeen && !normalMode){ dragOffX+=dx; dragOffY+=dy; }
  });
  stage.addEventListener('pointerup',e=>{
    dragging=false;stage.classList.remove('dragging');
    const totDX=e.clientX-startPX, totDY=e.clientY-startPY, dt=Date.now()-startT;

    // 素早い縦フリック → 動画切り替え(上=次、下=前)
    if(playlist.length>1 && dt<SWIPE_TIME
        && Math.abs(totDY)>SWIPE_DIST && Math.abs(totDY)>Math.abs(totDX)*1.2){
      loadVideo(idx + (totDY<0 ? 1 : -1));
      return;
    }
    // ほぼ動いていない → タップで再生/停止
    if(moved<6 && v.src){ v.paused ? v.play().catch(()=>{}) : v.pause(); }
  });
  stage.addEventListener('pointercancel',()=>{dragging=false;stage.classList.remove('dragging');});

  v.addEventListener('loadedmetadata',()=>{
    vw=v.videoWidth; vh=v.videoHeight; layout();
    seek.disabled=false;
    tDur.textContent=fmt(v.duration);
  });

  /* ---------- seek ---------- */
  function fmt(t){
    if(!isFinite(t)||t<0) return '0:00';
    const m=Math.floor(t/60), s=Math.floor(t%60);
    return m+':'+(s<10?'0':'')+s;
  }
  let scrubbing=false;
  v.addEventListener('timeupdate',()=>{
    if(scrubbing||!isFinite(v.duration)||!v.duration) return;
    seek.value=Math.round(v.currentTime/v.duration*1000);
    tCur.textContent=fmt(v.currentTime);
  });
  seek.addEventListener('pointerdown',()=>{scrubbing=true;});
  seek.addEventListener('input',()=>{
    if(!isFinite(v.duration)||!v.duration) return;
    const t=seek.value/1000*v.duration;
    tCur.textContent=fmt(t);
    v.currentTime=t;
  });
  const endScrub=()=>{scrubbing=false;};
  seek.addEventListener('pointerup',endScrub);
  seek.addEventListener('pointercancel',endScrub);
  seek.addEventListener('change',endScrub);

  /* ---------- normal playback toggle ---------- */
  function setNormal(on){
    normalMode=on;
    normalBtn.textContent = on ? '傾き表示' : '通常再生';
    normalBtn.classList.toggle('primary', on);
    zoomEl.disabled=on;
    gauge.classList.toggle('on', !on && gyroSeen);
    dragOffX=dragOffY=0;
    layout();
    showHint(on?'通常再生に戻しました':'傾き表示に切り替えました',1400);
  }
  normalBtn.addEventListener('click',()=>setNormal(!normalMode));

  /* ---------- controls ---------- */
  zoomEl.addEventListener('input',()=>{ zoom=+zoomEl.value; zoomV.textContent=zoom.toFixed(2)+'\u00D7'; layout(); });

  if(!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen){
    fullBtn.hidden=true;                       // iPhone Safari has no Fullscreen API
  }
  fullBtn.addEventListener('click',()=>{
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    const el=document.documentElement;
    (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
  });

  foldBtn.addEventListener('click',()=>{
    const hidden=ctl.classList.toggle('hide');
    foldBtn.textContent=hidden?'▴':'▾';
    foldBtn.setAttribute('aria-expanded', String(!hidden));
    setTimeout(layout,50);
  });

  let hintT=null;
  function showHint(msg,ms){
    hint.textContent=msg; hint.classList.add('on');
    clearTimeout(hintT); hintT=setTimeout(()=>hint.classList.remove('on'),ms||2000);
  }
})();
</script>
</body>
</html>
